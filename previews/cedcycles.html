<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CedCycles — Live Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --primary-light: #60a5fa;
      --primary-rgb: 59, 130, 246;
      --secondary: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border-color: #e2e8f0;
      --bg-white: #ffffff;
      --bg-gray: #f8fafc;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --purple: #8b5cf6;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
      --shadow-xl: 0 20px 40px rgba(0, 0, 0, 0.15);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      background-color: var(--bg-gray);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; transition: color 0.2s ease; }
    button { font-family: inherit; cursor: pointer; }

    /* Header (Exact CedCycles Header.css) */
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }
    .header-main {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 14px 24px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.45rem;
      font-weight: 800;
      color: white;
      letter-spacing: -0.5px;
      background: none;
      border: none;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }
    .search-box {
      flex: 1;
      display: flex;
      max-width: 540px;
      position: relative;
    }
    .search-input {
      flex: 1;
      padding: 11px 16px;
      border: none;
      border-radius: 12px 0 0 12px;
      font-size: 0.9rem;
      outline: none;
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
    }
    .search-input:focus { background: white; }
    .search-btn {
      padding: 11px 22px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      border-radius: 0 12px 12px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .search-btn:hover { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); }
    .search-icon-img { width: 18px; height: 18px; object-fit: contain; }

    .search-suggestions {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 6px;
      list-style: none;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.14);
      z-index: 40;
      max-height: 280px;
      overflow-y: auto;
    }
    .suggestion-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      cursor: pointer;
      border-radius: 8px;
      color: #1f2937;
    }
    .suggestion-item:hover { background: #f3f4f6; }
    .suggestion-image {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    .suggestion-name { font-size: 0.88rem; font-weight: 600; display: block; }
    .suggestion-price { font-size: 0.78rem; color: #059669; font-weight: 600; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header-action {
      display: flex;
      align-items: center;
      gap: 7px;
      color: white;
      font-size: 0.8rem;
      font-weight: 600;
      position: relative;
      background: none;
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      transition: background 0.2s ease;
    }
    .header-action:hover { background: rgba(255, 255, 255, 0.1); }
    .header-action svg { width: 18px; height: 18px; opacity: 0.85; }
    .cart-badge {
      position: absolute;
      top: 0;
      right: 0;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.5);
    }

    .header-nav {
      background: rgba(0, 0, 0, 0.2);
      padding: 0 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .header-nav-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 0;
      overflow-x: auto;
    }
    .nav-link {
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.84rem;
      font-weight: 600;
      white-space: nowrap;
      padding: 6px 14px;
      border-radius: 8px;
      background: none;
      border: none;
      transition: all 0.2s ease;
    }
    .nav-link:hover, .nav-link.active {
      color: white;
      background: rgba(255, 255, 255, 0.14);
    }

    /* Landing Hero & Sections (Exact Landing.css) */
    .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; width: 100%; }
    .hero-section {
      background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
      color: white;
      padding: 64px 20px;
      text-align: center;
    }
    .hero-content { max-width: 760px; margin: 0 auto; }
    .hero-content h1 { font-size: clamp(1.9rem, 4vw, 2.75rem); font-weight: 800; margin-bottom: 16px; line-height: 1.15; }
    .hero-content p { font-size: 1.05rem; opacity: 0.92; margin-bottom: 26px; }
    .hero-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .hero-btn {
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      transition: all 0.2s;
    }
    .hero-btn.primary { background: white; color: var(--primary); }
    .hero-btn.primary:hover { background: #f1f5f9; transform: translateY(-2px); }
    .hero-btn.secondary { background: transparent; color: white; border: 2px solid white; }
    .hero-btn.secondary:hover { background: rgba(255, 255, 255, 0.12); }

    .section { padding: 44px 0; }
    .section-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: -0.4px;
    }
    .section-title::before {
      content: "";
      width: 5px;
      height: 22px;
      background: linear-gradient(180deg, var(--primary) 0%, var(--purple) 100%);
      border-radius: 3px;
    }

    /* Product Cards (Exact Shop.css) */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 20px;
    }
    .product-card {
      background: white;
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
      text-align: left;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-xl);
      border-color: var(--primary-light);
    }
    .product-image {
      position: relative;
      aspect-ratio: 1;
      background: var(--secondary);
      overflow: hidden;
    }
    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .product-card:hover .product-image img { transform: scale(1.05); }
    .product-discount {
      position: absolute;
      top: 10px;
      right: 10px;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.38);
    }
    .product-info {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .product-name {
      font-size: 0.92rem;
      color: var(--text-primary);
      margin-bottom: 8px;
      line-height: 1.4;
      font-weight: 600;
      min-height: 2.6em;
    }
    .product-price {
      color: var(--primary);
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.4px;
    }
    .product-original-price {
      color: var(--text-muted);
      font-size: 0.82rem;
      text-decoration: line-through;
      margin-left: 6px;
    }
    .product-meta {
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Categories Grid */
    .categories-section { padding: 48px 0; background: white; }
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 14px;
    }
    .category-card-landing {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      min-height: 76px;
      background: var(--bg-gray);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      font-weight: 700;
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .category-card-landing:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      background: white;
      border-color: var(--primary-light);
      color: var(--primary);
    }

    /* Features & Footer */
    .features-section { padding: 48px 0; background: var(--bg-gray); }
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 24px; }
    .feature-item { text-align: center; }
    .feature-icon { font-size: 2.1rem; margin-bottom: 8px; }
    .feature-item h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .feature-item p { color: var(--text-secondary); font-size: 0.86rem; }

    .footer { background: #1a1a1a; color: white; padding: 44px 0 20px; }
    .footer-content { display: grid; grid-template-columns: 2fr repeat(3, 1fr); gap: 32px; margin-bottom: 28px; }
    .footer-brand h3 { font-size: 1.35rem; margin-bottom: 10px; }
    .footer-brand p { color: #94a3b8; font-size: 0.88rem; }
    .footer-links h4 { font-size: 0.95rem; margin-bottom: 12px; }
    .footer-links button {
      display: block;
      background: none;
      border: none;
      color: #94a3b8;
      margin-bottom: 6px;
      font-size: 0.86rem;
      padding: 0;
    }
    .footer-links button:hover { color: white; }
    .footer-bottom {
      padding-top: 16px;
      border-top: 1px solid #333;
      text-align: center;
      color: #64748b;
      font-size: 0.82rem;
    }

    /* Shop Page Layout (Exact Shop.css) */
    .shop-page {
      display: flex;
      gap: 24px;
      padding: 28px 24px;
      max-width: 1280px;
      margin: 0 auto;
    }
    .shop-sidebar { width: 215px; flex-shrink: 0; }
    .category-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }
    .category-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .category-list { list-style: none; }
    .category-link {
      padding: 9px 12px;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 3px;
    }
    .category-link:hover { background: var(--secondary); color: var(--text-primary); }
    .category-link.active {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.12), rgba(139, 92, 246, 0.12));
      color: var(--primary);
      font-weight: 700;
    }
    .shop-main { flex: 1; min-width: 0; }
    .shop-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: white;
      padding: 14px 20px;
      border-radius: var(--radius-lg);
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }
    .result-count { color: var(--text-secondary); font-size: 0.88rem; font-weight: 600; }
    .sort-options { display: flex; flex-wrap: wrap; gap: 6px; }
    .sort-btn {
      padding: 8px 13px;
      border: 1.5px solid var(--border-color);
      background: white;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all 0.2s;
    }
    .sort-btn:hover { border-color: var(--primary); color: var(--primary); }
    .sort-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-color: var(--primary);
      color: white;
    }

    /* Product Detail Page (Exact ProductDetail.css) */
    .product-detail-page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 24px;
      display: grid;
      grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
      gap: 28px;
    }
    .product-gallery {
      background: white;
      border-radius: var(--radius-lg);
      padding: 18px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }
    .product-main-image {
      aspect-ratio: 1;
      background: var(--secondary);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .product-main-image img { width: 100%; height: 100%; object-fit: cover; }
    .product-detail-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 26px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .product-brand { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .detail-title { font-size: 1.6rem; font-weight: 800; line-height: 1.25; }
    .detail-price-box {
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: var(--bg-gray);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .detail-price { font-size: 1.75rem; font-weight: 800; color: var(--primary); }
    .detail-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 6px; }
    .btn-primary {
      padding: 12px 26px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.92rem;
      box-shadow: 0 4px 14px rgba(var(--primary-rgb), 0.35);
    }
    .btn-primary:hover { transform: translateY(-1px); }
    .btn-secondary {
      padding: 12px 20px;
      background: white;
      color: var(--text-primary);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.9rem;
    }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

    /* Cart Page (Exact Cart.css) */
    .cart-page { max-width: 1120px; margin: 0 auto; padding: 28px 24px; }
    .cart-header {
      background: white;
      border-radius: var(--radius-lg);
      padding: 14px 20px;
      border: 1px solid var(--border-color);
      display: grid;
      grid-template-columns: 120px 1fr 110px 125px 105px 46px;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }
    .cart-items { display: flex; flex-direction: column; gap: 10px; }
    .cart-item {
      background: white;
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      border: 1px solid var(--border-color);
      display: grid;
      grid-template-columns: 36px 1fr 110px 125px 105px 46px;
      align-items: center;
      gap: 10px;
    }
    .cart-item-product { display: flex; align-items: center; gap: 12px; }
    .cart-item-image { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border-color); }
    .cart-item-name { font-weight: 700; font-size: 0.92rem; }
    .cart-item-variant { font-size: 0.8rem; color: var(--text-muted); }
    .cart-item-price { font-weight: 700; text-align: center; }
    .cart-item-quantity { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .qty-btn {
      width: 30px;
      height: 30px;
      border: 1.5px solid var(--border-color);
      background: white;
      border-radius: 8px;
      font-weight: 700;
      color: var(--text-secondary);
    }
    .qty-btn:hover { border-color: var(--primary); color: var(--primary); }
    .qty-value { width: 32px; text-align: center; font-weight: 700; }
    .cart-item-total { text-align: right; font-weight: 800; color: var(--primary); }
    .remove-btn { background: none; border: none; color: var(--text-muted); font-size: 1.1rem; padding: 6px; border-radius: 8px; }
    .remove-btn:hover { color: var(--error); background: #fef2f2; }
    .cart-summary {
      background: white;
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-md);
    }
    .cart-summary-row { display: flex; justify-content: space-between; gap: 36px; font-size: 0.92rem; margin-bottom: 8px; }
    .cart-summary-row.free-shipping span:last-child { color: #059669; font-weight: 700; }
    .cart-summary-row.total { font-size: 1.15rem; font-weight: 800; padding-top: 10px; border-top: 1px solid var(--border-color); }
    .cart-summary-row.total span:last-child { color: var(--primary); font-size: 1.3rem; }
    .free-shipping-msg { font-size: 0.8rem; color: #059669; font-weight: 600; margin-bottom: 6px; }
    .checkout-btn {
      padding: 13px 40px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 4px 14px rgba(var(--primary-rgb), 0.35);
    }
    .checkout-toast {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      font-weight: 600;
      font-size: 0.88rem;
    }

    @media (max-width: 768px) {
      .header-main { gap: 10px; padding: 10px 14px; }
      .logo-text { display: none; }
      .shop-page { flex-direction: column; }
      .shop-sidebar { width: 100%; }
      .product-detail-page { grid-template-columns: 1fr; }
      .footer-content { grid-template-columns: 1fr 1fr; }
      .cart-header { display: none; }
      .cart-item { grid-template-columns: 1fr; }
      .cart-summary { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const FALLBACK_PRODUCT_SVG =
      "data:image/svg+xml," +
      encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#f1f5f9"/><g fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round"><path d="M160 110h95l-15 34h-75z"/><path d="M202 144l-26 165"/></g><text x="200" y="352" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#475569">Weapon · Aero Seatpost</text></svg>`
      );

    // Real CedCycles MongoDB products snapshot (from product.json)
    const PRODUCTS = [
      {
        _id: "69c4e74afeb0bfd6ae734fe0",
        slug: "carbon-fiber-road-frame",
        name: "Carbon Fiber Road Frame",
        brand: "Specialized",
        category: "frames",
        price: 899.99,
        originalPrice: 1199.99,
        stock: 15,
        sold: 89,
        rating: 4.9,
        description: "High-performance carbon fiber frame, lightweight and durable. Perfect for competitive cycling.",
        image: "../assets/cedcycles/products/carbon-fiber-road-frame.webp"
      },
      {
        _id: "69c4e74afeb0bfd6ae734fe1",
        slug: "mountain-bike-alloy-frame",
        name: "Mountain Bike Alloy Frame",
        brand: "MountainPeak",

    function notifyParentRoute() {
      let path = "/";
      if (state.route === "shop") {
        path = state.category !== "all" ? `/shop?category=${state.category}` : "/shop";
        if (state.search) path += (path.includes("?") ? "&" : "?") + `search=${encodeURIComponent(state.search)}`;
      } else if (state.route === "product" && state.activeSlug) {
        path = `/product/${state.activeSlug}`;
      } else if (state.route === "cart") {
        path = "/cart";
      }
      window.parent.postMessage({ type: "cedcycles-route", path }, "*");
    }

    window.addEventListener("message", (e) => {
      if (!e.data || e.data.type !== "cedcycles-navigate") return;
      state.route = e.data.route || "landing";
      if (e.data.category) state.category = e.data.category;
      state.checkoutMessage = "";
      render();
      window.scrollTo(0, 0);
    });

      return state.cart.reduce((sum, item) => sum + item.quantity, 0);

      const existing = state.cart.find((c) => c.productId === productId);

      state.detailNotice = "Added to cart!";
      render();
    }

        return catOk && qOk;

      if (state.sort === "popular") list = [...list].sort((a, b) => b.sold - a.sold);
      else if (state.sort === "rating") list = [...list].sort((a, b) => b.rating - a.rating);
      else if (state.sort === "price_asc") list = [...list].sort((a, b) => a.price - b.price);

            <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-end;">
              <button type="button" class="checkout-btn" id="cart-checkout-btn" ${selected.length === 0 ? "disabled" : ""}>Checkout</button>
              <button type="button" style="background:none;border:none;color:var(--primary);font-weight:600;font-size:0.88rem;" data-nav="shop" data-cat="all">Continue Shopping</button>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      const app = document.getElementById("app");
      let page = "";
      if (state.route === "landing") page = renderLanding();
      else if (state.route === "shop") page = renderShop();
      else if (state.route === "product") page = renderProductDetail();
      else if (state.route === "cart") page = renderCart();

      app.innerHTML = renderHeader() + page;
      bindEvents();
      notifyParentRoute();
    }

    function bindEvents() {
      document.querySelectorAll("[data-nav]").forEach((el) => {
        el.addEventListener("click", () => {
          state.route = el.getAttribute("data-nav");
          const cat = el.getAttribute("data-cat");
          if (cat) state.category = cat;
          state.detailNotice = "";
          state.checkoutMessage = "";
          render();
          window.scrollTo(0, 0);
        });
      });

      document.querySelectorAll("[data-open-product]").forEach((el) => {
        el.addEventListener("click", () => {
          state.activeSlug = el.getAttribute("data-open-product");
          state.route = "product";
          state.detailQty = 1;
          state.detailNotice = "";
          render();
          window.scrollTo(0, 0);
        });
      });

      document.querySelectorAll("[data-sort]").forEach((el) => {
        el.addEventListener("click", () => {
          state.sort = el.getAttribute("data-sort");
          render();
        });
      });

      const searchInput = document.getElementById("cc-search-input");
      const searchBtn = document.getElementById("cc-search-btn");
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          state.search = e.target.value;
          const pos = e.target.selectionStart;
          render();
          const next = document.getElementById("cc-search-input");
          if (next) {
            next.focus();
            next.setSelectionRange(pos, pos);
          }
        });
        searchInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            state.route = "shop";
            render();
          }
        });
      }
      if (searchBtn) {
        searchBtn.addEventListener("click", () => {
          state.route = "shop";
          render();
        });
      }

      const decQty = document.getElementById("detail-qty-dec");
      const incQty = document.getElementById("detail-qty-inc");
      const addBtn = document.getElementById("detail-add-cart");
      if (decQty) decQty.addEventListener("click", () => { if (state.detailQty > 1) { state.detailQty--; render(); } });
      if (incQty) incQty.addEventListener("click", () => { state.detailQty++; render(); });
      if (addBtn) {
        addBtn.addEventListener("click", () => {
          const product = PRODUCTS.find((p) => p.slug === state.activeSlug);
          if (product) addToCart(product._id, state.detailQty);
        });
      }

      const selectAll = document.getElementById("cart-select-all");
      if (selectAll) {
        selectAll.addEventListener("change", () => {
          state.cart.forEach((c) => (c.selected = selectAll.checked));
          render();
        });
      }
      document.querySelectorAll("[data-cart-toggle]").forEach((cb) => {
        cb.addEventListener("change", () => {
          const item = state.cart.find((c) => c.productId === cb.getAttribute("data-cart-toggle"));
          if (item) item.selected = cb.checked;
          render();
        });
      });
      document.querySelectorAll("[data-cart-inc]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const item = state.cart.find((c) => c.productId === btn.getAttribute("data-cart-inc"));
          if (item) item.quantity++;
          render();
        });
      });
      document.querySelectorAll("[data-cart-dec]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const item = state.cart.find((c) => c.productId === btn.getAttribute("data-cart-dec"));
          if (item && item.quantity > 1) item.quantity--;
          render();
        });
      });
      document.querySelectorAll("[data-cart-rm]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.cart = state.cart.filter((c) => c.productId !== btn.getAttribute("data-cart-rm"));
          render();
        });
      });
      const checkoutBtn = document.getElementById("cart-checkout-btn");
      if (checkoutBtn) {
        checkoutBtn.addEventListener("click", () => {
          state.checkoutMessage = "Order confirmed! Thank you for shopping with CedCycles.";
          render();
        });
      }
    }

    render();
  </script>
</body>
</html>
